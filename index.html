<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxd 攻略 Wiki 全更新履歴アーカイブ</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #57c4ff;
      --border-color: #e1e4e8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
    }
    .sub {
      color: #666;
      font-size: 0.9rem;
    }
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .log-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-color);
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .log-title {
      font-weight: bold;
      color: #0066cc;
      text-decoration: none;
      word-break: break-all;
    }
    .log-title:hover {
      text-decoration: underline;
    }
    .log-time {
      font-size: 0.85rem;
      color: #777;
      white-space: nowrap;
    }
    #loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Bloxd 攻略 Wiki 全更新履歴アーカイブ</h1>
      <div class="sub">Bloxd攻略Wikiの過去の更新ログ全件（2026/08/26 7:30 JSTからのもの）</div>
    </header>

    <div id="loading">データを読み込み中...</div>
    <div id="logList" class="log-list"></div>
  </div>

  <script>
    async function loadLogs() {
      const loadingEl = document.getElementById("loading");
      const listEl = document.getElementById("logList");

      try {
        // 同一ディレクトリの history.json を取得
        const res = await fetch("./history.json");
        if (!res.ok) throw new Error("データの取得に失敗しました");

        const logs = await res.json();
        loadingEl.style.display = "none";

        if (logs.length === 0) {
          listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">ログはまだありません</div>';
          return;
        }

        listEl.innerHTML = logs.map(item => `
          <div class="log-item">
            <a href="${item.url}" class="log-title" target="_blank" rel="noopener noreferrer">${item.title}</a>
            <span class="log-time">${item.timestamp}</span>
          </div>
        `).join("");
      } catch (err) {
        loadingEl.innerText = "❌ データの読み込みに失敗しました。";
        console.error(err);
      }
    }

    loadLogs();
  </script>
</body>
</html>
